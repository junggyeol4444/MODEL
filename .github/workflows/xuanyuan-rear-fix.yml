name: Xuanyuan rear bake retry and validation
on:
  push:
    paths: ['.github/workflows/xuanyuan-rear-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rear_texture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xuanyuan-v3-projection
          run-id: 45775760600
          github-token: ${{ github.token }}
          path: output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy<2" bpy==4.3.0 pillow "rembg[cpu]"
      - name: Verify and isolate rear reference
        run: |
          echo "7610f51bd569f6079d925331a0ce79f948cb55cbe69d127283ab9f35a976949a  references/xuanyuan_back.webp" | sha256sum -c -
          cp references/xuanyuan_back.webp output/
          python -c 'from PIL import Image;from rembg import remove;im=remove(Image.open("output/xuanyuan_back.webp").convert("RGBA"));im.crop(im.getchannel("A").point(lambda x:255 if x>100 else 0).getbbox()).save("output/rear_reference.png")'
      - name: Bake actual rear details onto current mesh
        run: python scripts/project_rear.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xuanyuan-rear-projection-fixed
          path: |
            output/xuanyuan_multiview.*
            output/rear_*.png
            output/rear_report.json
            output/projected_view_*.png
          if-no-files-found: warn
