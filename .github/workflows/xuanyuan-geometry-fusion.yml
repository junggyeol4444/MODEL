name: Xuanyuan rear geometry fusion candidate
on:
  push:
    paths: ['.github/workflows/xuanyuan-geometry-fusion.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xuanyuan-rear-projection-fixed
          run-id: 45778761323
          github-token: ${{ github.token }}
          path: output/base
      - uses: actions/download-artifact@v4
        with:
          name: xuanyuan-rear-shape-candidate
          run-id: 45776466141
          github-token: ${{ github.token }}
          path: output/rear
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2' bpy==4.3.0 scipy pillow
      - run: python scripts/fuse_rear_envelope.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xuanyuan-geometry-fusion-candidate
          path: |
            output/xuanyuan_geometry_candidate.*
            output/geometry_*.json
            output/geometry_*.png
            output/stage*.png
