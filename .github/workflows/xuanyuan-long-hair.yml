name: Xuanyuan independent long hair candidate
on:
  push:
    paths: ['.github/workflows/xuanyuan-long-hair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  hair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xuanyuan-side-repair-candidate
          run-id: 46001231698
          github-token: ${{ github.token }}
          path: output/base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2' bpy==4.3.0 scipy pillow
      - run: python scripts/build_long_hair_surface.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xuanyuan-independent-hair-candidate
          path: |
            output/xuanyuan_hair_candidate.*
            output/hair_report.json
            output/hair_comparison.png
            output/hair_flow_texture.png
            output/hair_review_*.png
