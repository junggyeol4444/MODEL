name: Xuanyuan layered hair refinement
on:
  push:
    paths: ['.github/workflows/xuanyuan-layered-hair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xuanyuan-independent-hair-candidate
          run-id: 46111630780
          github-token: ${{ github.token }}
          path: output/base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2' bpy==4.3.0 scipy pillow
      - run: python scripts/refine_layered_hair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xuanyuan-layered-hair-candidate
          path: |
            output/xuanyuan_layered_hair_candidate.*
            output/layered_hair_report.json
            output/layered_hair_comparison.png
            output/layered_review_*.png
